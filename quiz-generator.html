<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Générateur Quiz — BuzzQuiz PTG</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a1040 0%,#0d0b1f 100%);min-height:100vh;padding:24px 16px;color:#f4f1ff}
.container{max-width:1000px;margin:0 auto;background:#161230;border-radius:18px;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
h1{font-size:24px;color:#ffd166;margin-bottom:3px}
.sub{color:#9b8fc4;font-size:13px;margin-bottom:22px}
.meta-row{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin-bottom:18px}
.meta-field label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#9b8fc4;display:block;margin-bottom:5px}
.meta-field input{width:100%;background:#1e1940;border:1px solid rgba(255,255,255,.12);color:#f4f1ff;border-radius:8px;padding:9px 12px;font-size:14px;outline:none;font-family:inherit}
.meta-field input:focus{border-color:#8338ec}
.toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.stat{background:#1e1940;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:7px 14px;font-size:13px;color:#9b8fc4}
.stat b{color:#ffd166;font-size:15px;margin-left:5px}
.btn{padding:8px 16px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s,transform .1s;font-family:inherit;white-space:nowrap}
.btn:hover{opacity:.85;transform:translateY(-1px)}
.bp{background:#8338ec;color:#fff}.bg{background:transparent;border:1px solid rgba(255,255,255,.18);color:#f4f1ff}.bs{background:#06d6a0;color:#022}.bd{background:#ff5c7a;color:#fff}
/* Question cards */
#q-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.q-card{background:#1a1640;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:start;transition:border-color .15s}
.q-card:hover{border-color:rgba(131,56,236,.35)}
.q-num{color:#ffd166;font-weight:700;font-size:14px;text-align:center;padding-top:8px}
.q-body{display:flex;flex-direction:column;gap:8px}
textarea.fi,input.fi{width:100%;background:#0f0d28;border:1px solid rgba(255,255,255,.1);color:#f4f1ff;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;outline:none;transition:border-color .15s,background .15s;resize:none;line-height:1.5}
textarea.fi:focus,input.fi:focus{border-color:#8338ec;background:rgba(131,56,236,.12)}
textarea.fi::placeholder,input.fi::placeholder{color:rgba(255,255,255,.22)}
/* Choix */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.c-row{display:flex;align-items:center;gap:7px}
.cl{width:26px;height:26px;border-radius:6px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;cursor:pointer;transition:all .15s;user-select:none}
.ca{background:rgba(74,108,247,.25);color:#8fa8ff}
.cb{background:rgba(232,67,147,.25);color:#ff9bd0}
.cc{background:rgba(246,166,35,.25);color:#ffc96b}
.cd{background:rgba(6,214,160,.25);color:#4fffcc}
.cl.ok{outline:2px solid currentColor}
.ca.ok{background:#4a6cf7;color:#fff;outline-color:#4a6cf7}
.cb.ok{background:#e84393;color:#fff;outline-color:#e84393}
.cc.ok{background:#f6a623;color:#1a0;outline-color:#f6a623}
.cd.ok{background:#06d6a0;color:#022;outline-color:#06d6a0}
.c-row input.fi{flex:1;font-size:12px;padding:6px 9px}
.row-footer{display:flex;align-items:center;gap:8px}
.row-footer input.fi{flex:1;font-size:12px;padding:6px 9px}
.row-footer label{font-size:11px;color:#9b8fc4;white-space:nowrap;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.del-btn{width:30px;height:30px;border-radius:7px;border:none;background:rgba(255,92,122,.2);color:#ff5c7a;cursor:pointer;font-size:14px;display:grid;place-items:center;padding-top:6px;align-self:start}
.del-btn:hover{background:#ff5c7a;color:#fff}
.add-btn{width:100%;padding:12px;background:#8338ec;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s}
.add-btn:hover{opacity:.85}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e1940;border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:10px 20px;font-size:13px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.6);z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
</style>
</head>
<body>
<div class="container">
  <h1>BuzzQuiz — Générateur</h1>
  <p class="sub">Play Thau'Gether · Clique sur la lettre colorée pour marquer la bonne réponse</p>

  <div class="meta-row">
    <div class="meta-field">
      <label>Nom de la playlist *</label>
      <input type="text" id="pl-name" placeholder="Ex : Culture Générale">
    </div>
    <div class="meta-field">
      <label>Description</label>
      <input type="text" id="pl-desc" placeholder="Courte description...">
    </div>
  </div>

  <div class="toolbar">
    <div class="stat">Questions <b id="q-count">0</b></div>
    <button class="btn bp" onclick="addRow()">➕ Ajouter</button>
    <button class="btn bg" onclick="triggerImport()">📂 Importer JSON</button>
    <button class="btn bs" onclick="doExport()">💾 Exporter JSON</button>
    <button class="btn bd" onclick="clearAll()">🗑 Tout effacer</button>
    <input type="file" id="file-import" accept=".json" style="display:none" onchange="handleImport(this)">
  </div>

  <div id="q-list"></div>
  <button class="add-btn" onclick="addRow()">➕ Ajouter une question</button>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
let rowId=0,_tt;

function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),2500);
}

function addRow(q){
  const id=rowId++;
  const question=q?.q||'';
  const choices=q?.choices?.length===4?q.choices:['','','',''];
  const correct=typeof q?.correct==='number'?q.correct:0;
  const buzzer=q?.a||'';
  const lc=['a','b','c','d'];

  const card=document.createElement('div');
  card.className='q-card';card.id='row-'+id;
  card.innerHTML=`
    <div class="q-num" id="num-${id}"></div>
    <div class="q-body">
      <textarea class="fi" rows="2" placeholder="Saisis ta question ici…" id="q-${id}">${esc(question)}</textarea>
      <div class="choices">
        ${lc.map((l,i)=>`
        <div class="c-row">
          <div class="cl c${l}${i===correct?' ok':''}" id="cl-${id}-${i}"
               onclick="setCorrect(${id},${i})" title="Bonne réponse">${l.toUpperCase()}</div>
          <input type="text" class="fi" placeholder="Choix ${l.toUpperCase()}"
                 id="c-${id}-${i}" value="${esc(choices[i])}">
        </div>`).join('')}
      </div>
      <div class="row-footer">
        <label>🎤 Buzzer</label>
        <input type="text" class="fi" placeholder="Réponse courte pour le mode oral..." id="b-${id}" value="${esc(buzzer)}">
      </div>
    </div>
    <button class="del-btn" onclick="delRow(${id})">✕</button>
  `;
  document.getElementById('q-list').appendChild(card);
  updateNums();
  if(!q) setTimeout(()=>document.getElementById('q-'+id)?.focus(),30);
}

function setCorrect(rid,idx){
  ['a','b','c','d'].forEach((l,i)=>{
    const el=document.getElementById(`cl-${rid}-${i}`);
    if(el) el.className=`cl c${l}${i===idx?' ok':''}`;
  });
}

function delRow(id){
  document.getElementById('row-'+id)?.remove();
  updateNums();
}

function updateNums(){
  const rows=document.querySelectorAll('.q-card');
  document.getElementById('q-count').textContent=rows.length;
  rows.forEach((r,i)=>{
    const el=r.querySelector('[id^="num-"]');
    if(el) el.textContent=i+1;
  });
}

function readAll(){
  return[...document.querySelectorAll('.q-card')].map(r=>{
    const id=r.id.replace('row-','');
    const q=(document.getElementById('q-'+id)?.value||'').trim();
    if(!q) return null;
    const choices=[0,1,2,3].map(i=>(document.getElementById(`c-${id}-${i}`)?.value||'').trim());
    const buzzer=(document.getElementById('b-'+id)?.value||'').trim();
    let correct=0;
    [0,1,2,3].forEach(i=>{if(document.getElementById(`cl-${id}-${i}`)?.classList.contains('ok'))correct=i;});
    return{q,a:buzzer||choices[correct],choices,correct};
  }).filter(Boolean);
}

function doExport(){
  const name=document.getElementById('pl-name').value.trim();
  if(!name){showToast('⚠ Donne un nom à la playlist');return;}
  const questions=readAll();
  if(!questions.length){showToast('⚠ Ajoute au moins une question');return;}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({name,description:document.getElementById('pl-desc').value.trim(),questions},null,2)],{type:'application/json'}));
  a.download=name.replace(/[^a-zA-Z0-9-_]/g,'_').toLowerCase()+'.json';
  a.click();
  showToast('📥 '+questions.length+' questions exportées !');
}

function triggerImport(){document.getElementById('file-import').click();}
function handleImport(input){
  const file=input.files[0];if(!file) return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(d.name) document.getElementById('pl-name').value=d.name;
      if(d.description) document.getElementById('pl-desc').value=d.description;
      if(Array.isArray(d.questions)&&d.questions.length){
        if(document.querySelectorAll('.q-card').length&&!confirm('Remplacer les questions actuelles ?')) return;
        [...document.querySelectorAll('.q-card')].forEach(r=>r.remove());
        rowId=0;
        d.questions.forEach(q=>addRow(q));
        showToast('✓ '+d.questions.length+' questions importées !');
      }
    }catch(e){showToast('⚠ Fichier invalide');}
  };
  r.readAsText(file);input.value='';
}

function clearAll(){
  if(!document.querySelectorAll('.q-card').length) return;
  if(!confirm('Supprimer toutes les questions ?')) return;
  [...document.querySelectorAll('.q-card')].forEach(r=>r.remove());
  rowId=0;updateNums();
  showToast('Liste vidée');
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

addRow();
</script>
</body>
</html>
