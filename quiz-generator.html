<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Generator — BuzzQuiz PTG</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;700;900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d0b1f; --panel: #161230; --panel2: #1e1940;
  --line: rgba(255,255,255,.1); --ink: #f4f1ff; --ink-dim: #9b8fc4;
  --accent: #ff5c7a; --gold: #ffd166; --mint: #06d6a0; --purple: #8338ec;
}
body { background: var(--bg); color: var(--ink); font-family: 'Outfit', sans-serif; font-size: 15px; min-height: 100vh; padding: 0 0 60px; }
.header { background: linear-gradient(135deg,#1a1040,#0d0b1f); border-bottom: 1px solid var(--line); padding: 18px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.header-logo { font-family: 'Fraunces'; font-weight: 900; font-size: 24px; }
.header-logo span { color: var(--accent); }
.header-sub { color: var(--ink-dim); font-size: 13px; }
.header-right { margin-left: auto; display: flex; gap: 10px; }
.main { max-width: 960px; margin: 0 auto; padding: 24px 16px; display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
@media (max-width: 780px) { .main { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
.card-title { font-family: 'Fraunces'; font-weight: 900; font-size: 17px; margin-bottom: 14px; }
label { display: block; font-weight: 700; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-dim); margin: 12px 0 5px; }
label:first-of-type { margin-top: 0; }
input[type=text], input[type=password], textarea, select { width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 9px 12px; font-family: 'Outfit'; font-size: 14px; outline: none; }
input:focus, textarea:focus { border-color: var(--purple); }
textarea { resize: vertical; min-height: 64px; line-height: 1.5; }
.meta-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
.choice-row { display: flex; align-items: center; gap: 7px; }
.choice-letter { width: 28px; height: 28px; border-radius: 7px; flex: none; display: grid; place-items: center; font-weight: 800; font-size: 12px; }
.c0 { background: #4a6cf7; color: #fff; } .c1 { background: #e84393; color: #fff; }
.c2 { background: #f6a623; color: #1a0a00; } .c3 { background: #06d6a0; color: #022; }
.choice-input { flex: 1; }
.correct-radio { display: none; }
.correct-label { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); flex: none; cursor: pointer; display: grid; place-items: center; transition: all .15s; }
.correct-radio:checked + .correct-label { background: var(--mint); border-color: var(--mint); }
.correct-radio:checked + .correct-label::after { content: '✓'; font-size: 11px; color: #022; font-weight: 900; }
.btn { padding: 9px 16px; border-radius: 10px; border: none; font-family: 'Outfit'; font-weight: 700; font-size: 13px; cursor: pointer; transition: opacity .15s, transform .1s; }
.btn:hover { opacity: .85; transform: translateY(-1px); }
.btn-primary { background: var(--purple); color: #fff; }
.btn-gold { background: var(--gold); color: #1a0800; }
.btn-mint { background: var(--mint); color: #022; }
.btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn-accent { background: var(--accent); color: #fff; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-full { width: 100%; text-align: center; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.ai-box { background: linear-gradient(135deg,rgba(131,56,236,.12),rgba(6,214,160,.08)); border: 1px solid rgba(131,56,236,.35); border-radius: 10px; padding: 12px; margin-top: 12px; }
.ai-tag { display: inline-flex; align-items: center; gap: 5px; background: var(--purple); color: #fff; border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 700; margin-bottom: 8px; }
.spinner-sm { width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.2); border-top-color: var(--purple); border-radius: 50%; animation: spin .7s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.ai-gen-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-dim); padding: 6px 0; }
.api-row { display: flex; gap: 8px; }
.api-row input { flex: 1; }
.api-st { font-size: 12px; margin-top: 4px; }
.api-st.ok { color: var(--mint); } .api-st.err { color: var(--accent); }
.q-list { display: flex; flex-direction: column; gap: 8px; }
.q-item { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; align-items: flex-start; gap: 10px; }
.q-num { font-family: 'Fraunces'; font-weight: 900; font-size: 17px; color: var(--gold); min-width: 24px; }
.q-body { flex: 1; min-width: 0; }
.q-text { font-weight: 700; font-size: 13px; line-height: 1.4; }
.q-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.q-chip { font-size: 10px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-dim); }
.q-chip.ok { background: rgba(6,214,160,.12); border-color: var(--mint); color: var(--mint); }
.q-actions { display: flex; gap: 4px; flex: none; }
.q-btn { width: 26px; height: 26px; border-radius: 7px; border: none; cursor: pointer; font-size: 12px; display: grid; place-items: center; }
.q-btn-edit { background: rgba(131,56,236,.2); color: var(--purple); }
.q-btn-del  { background: rgba(255,92,122,.2); color: var(--accent); }
.q-btn-edit:hover { background: var(--purple); color: #fff; }
.q-btn-del:hover  { background: var(--accent); color: #fff; }
.empty-state { text-align: center; padding: 28px 12px; color: var(--ink-dim); }
.empty-state div:first-child { font-size: 36px; margin-bottom: 8px; }
.notif { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 18px; font-weight: 600; font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.6); z-index: 9999; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
.notif.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-logo">Buzz<span>Quiz</span></div>
    <div class="header-sub">Générateur de questions — Play Thau'Gether</div>
  </div>
  <div class="header-right">
    <button class="btn btn-ghost btn-sm" onclick="triggerImport()">📂 Importer JSON</button>
    <button class="btn btn-mint btn-sm" onclick="doExport()">💾 Exporter</button>
    <input type="file" id="file-import" accept=".json" style="display:none" onchange="handleImport(this)">
  </div>
</div>

<div class="main">
  <!-- GAUCHE : éditeur -->
  <div>
    <div class="card">
      <div class="card-title" id="editor-title">➕ Nouvelle question</div>
      <label>Question *</label>
      <textarea id="q-question" placeholder="Saisis ta question ici…"></textarea>

      <label style="margin-top:14px;">4 choix — clique sur le rond pour marquer la bonne réponse *</label>
      <div class="choices-grid">
        <div class="choice-row">
          <div class="choice-letter c0">A</div>
          <input class="choice-input" type="text" id="c0" placeholder="Choix A">
          <input class="correct-radio" type="radio" name="correct" id="r0" value="0">
          <label class="correct-label" for="r0"></label>
        </div>
        <div class="choice-row">
          <div class="choice-letter c1">B</div>
          <input class="choice-input" type="text" id="c1" placeholder="Choix B">
          <input class="correct-radio" type="radio" name="correct" id="r1" value="1">
          <label class="correct-label" for="r1"></label>
        </div>
        <div class="choice-row">
          <div class="choice-letter c2">C</div>
          <input class="choice-input" type="text" id="c2" placeholder="Choix C">
          <input class="correct-radio" type="radio" name="correct" id="r2" value="2">
          <label class="correct-label" for="r2"></label>
        </div>
        <div class="choice-row">
          <div class="choice-letter c3">D</div>
          <input class="choice-input" type="text" id="c3" placeholder="Choix D">
          <input class="correct-radio" type="radio" name="correct" id="r3" value="3">
          <label class="correct-label" for="r3"></label>
        </div>
      </div>

      <label>Réponse buzzer (version courte pour le mode oral)</label>
      <input type="text" id="q-buzzer" placeholder="Ex : L'Empire ottoman">

      <div class="btn-row">
        <button class="btn btn-primary" style="flex:1" onclick="saveQuestion()">💾 Sauvegarder la question</button>
        <button class="btn btn-ghost" onclick="resetEditor()">🔄 Reset</button>
      </div>
    </div>
  </div>

  <!-- DROITE : sidebar -->
  <div>
    <!-- Playlist meta -->
    <div class="card">
      <div class="card-title">📋 Infos playlist</div>
      <div class="meta-row">
        <div>
          <label>Nom *</label>
          <input type="text" id="pl-name" placeholder="Ex : Culture Générale">
        </div>
        <div>
          <label>Description</label>
          <input type="text" id="pl-desc" placeholder="Courte description…">
        </div>
      </div>
    </div>

    <!-- Liste -->
    <div class="card">
      <div class="card-title" style="display:flex; justify-content:space-between; align-items:center;">
        <span>📚 Questions (<span id="q-count">0</span>)</span>
        <button class="btn btn-ghost btn-sm" onclick="clearAll()">🗑 Tout effacer</button>
      </div>
      <div id="q-list">
        <div class="empty-state"><div>📝</div><div>Aucune question</div></div>
      </div>
      <div class="btn-row" style="margin-top:12px;">
        <button class="btn btn-accent btn-full" onclick="doExport()">💾 Exporter la playlist JSON</button>
      </div>
    </div>
  </div>
</div>

<div class="notif" id="notif"></div>

<script>
'use strict';

// --- STATE ---
let questions = [];
let editIdx = null;

// --- TOAST ---
let _ntTimer;
function showNotif(msg) {
  const el = document.getElementById('notif');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_ntTimer);
  _ntTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// --- SAUVEGARDER QUESTION ---
function saveQuestion() {
  const q    = document.getElementById('q-question').value.trim();
  const c    = [0,1,2,3].map(i => document.getElementById('c'+i).value.trim());
  const r    = document.querySelector('input[name="correct"]:checked');
  const buzz = document.getElementById('q-buzzer').value.trim();

  if (!q) { showNotif('⚠ Écris la question'); return; }
  if (c.some(x => !x)) { showNotif('⚠ Remplis les 4 choix'); return; }
  if (!r) { showNotif('⚠ Clique sur le rond de la bonne réponse'); return; }

  const entry = { q, a: buzz || c[+r.value], choices: c, correct: +r.value };

  if (editIdx !== null) {
    questions[editIdx] = entry;
    editIdx = null;
    showNotif('✓ Question modifiée !');
  } else {
    questions.push(entry);
    showNotif('✓ Question ajoutée !');
  }
  resetEditor();
  renderList();
}

// --- RESET ÉDITEUR ---
function resetEditor() {
  document.getElementById('q-question').value = '';
  [0,1,2,3].forEach(i => { document.getElementById('c'+i).value = ''; });
  document.querySelectorAll('input[name="correct"]').forEach(r => r.checked = false);
  document.getElementById('q-buzzer').value = '';
  document.getElementById('ai-msg').innerHTML = '';
  document.getElementById('editor-title').textContent = '➕ Nouvelle question';
  editIdx = null;
}

// --- RENDER LISTE ---
function renderList() {
  const wrap = document.getElementById('q-list');
  document.getElementById('q-count').textContent = questions.length;

  if (!questions.length) {
    wrap.innerHTML = '<div class="empty-state"><div>📝</div><div>Aucune question</div></div>';
    return;
  }

  wrap.innerHTML = questions.map((q, i) => `
    <div class="q-item">
      <div class="q-num">${i+1}</div>
      <div class="q-body">
        <div class="q-text">${esc(q.q.length > 70 ? q.q.slice(0,70)+'…' : q.q)}</div>
        <div class="q-chips">
          ${q.choices.map((c,ci) => `<span class="q-chip ${ci===q.correct?'ok':''}">${['A','B','C','D'][ci]}: ${esc(c.length>18?c.slice(0,18)+'…':c)}</span>`).join('')}
        </div>
      </div>
      <div class="q-actions">
        <button class="q-btn q-btn-edit" onclick="loadQ(${i})">✏</button>
        <button class="q-btn q-btn-del"  onclick="delQ(${i})">✕</button>
      </div>
    </div>`).join('');
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function loadQ(i) {
  const q = questions[i];
  editIdx = i;
  document.getElementById('q-question').value = q.q;
  [0,1,2,3].forEach(j => document.getElementById('c'+j).value = q.choices[j] || '');
  document.querySelectorAll('input[name="correct"]').forEach(r => r.checked = +r.value === q.correct);
  document.getElementById('q-buzzer').value = q.a || '';
  document.getElementById('editor-title').textContent = `✏ Modifier question ${i+1}`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function delQ(i) {
  if (!confirm('Supprimer cette question ?')) return;
  questions.splice(i, 1);
  if (editIdx === i) resetEditor();
  else if (editIdx !== null && editIdx > i) editIdx--;
  renderList();
  showNotif('Question supprimée');
}

function clearAll() {
  if (!questions.length || !confirm('Supprimer toutes les questions ?')) return;
  questions = [];
  resetEditor();
  renderList();
  showNotif('Liste vidée');
}

// --- EXPORT ---
function doExport() {
  const name = document.getElementById('pl-name').value.trim();
  if (!name) { showNotif('⚠ Donne un nom à la playlist'); return; }
  if (!questions.length) { showNotif('⚠ Ajoute au moins une question'); return; }
  const blob = new Blob([JSON.stringify({ name, description: document.getElementById('pl-desc').value.trim(), questions }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name.replace(/[^a-zA-Z0-9-_]/g,'_').toLowerCase() + '.json';
  a.click();
  showNotif('📥 ' + questions.length + ' questions exportées !');
}

// --- IMPORT ---
function triggerImport() { document.getElementById('file-import').click(); }
function handleImport(input) {
  const file = input.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      if (d.name) document.getElementById('pl-name').value = d.name;
      if (d.description) document.getElementById('pl-desc').value = d.description;
      if (Array.isArray(d.questions) && d.questions.length) {
        if (questions.length && !confirm('Remplacer les questions actuelles ?')) return;
        questions = d.questions;
        resetEditor();
        renderList();
        showNotif('✓ ' + questions.length + ' questions importées !');
      }
    } catch(e) { showNotif('⚠ Fichier invalide'); }
  };
  r.readAsText(file);
  input.value = '';
}
</script>
</body>
</html>
